name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual trigger. Selecting a tag in the "Run workflow" dropdown makes the
  # release job run against that tag (github.ref becomes refs/tags/<tag>).
  workflow_dispatch:

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/build/html -W --keep-going

      - name: Verify required documentation tree exists
        run: |
          for f in \
            docs/build/html/index.html \
            docs/build/html/getting-started/index.html \
            docs/build/html/language/index.html \
            docs/build/html/stdlib/index.html \
            docs/build/html/tools/index.html \
            docs/build/html/targets/index.html \
            docs/build/html/targets/compute-targets.html \
            docs/build/html/compiler/index.html \
            docs/build/html/status/index.html \
            docs/build/html/status/scope.html \
            docs/build/html/status/rc-checklist.html \
            docs/build/html/status/migration-beta1.html \
            docs/build/html/status/compatibility.html \
            docs/build/html/reference/index.html \
            docs/build/html/reference/stable-api.html \
            docs/build/html/reference/example-matrix.html \
            docs/build/html/development/index.html \
            docs/build/html/development/feature-freeze.html \
            docs/build/html/development/release.html \
            docs/build/html/development/reporting-bugs.html \
            docs/build/html/examples/index.html \
            docs/build/html/getting-started/first-project.html \
            docs/build/html/getting-started/workspace.html \
            docs/build/html/release-notes.html \
          ; do
            if [ ! -f "$f" ]; then
              echo "Missing required doc page: $f"
              exit 1
            fi
          done
          echo "Documentation tree OK"

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Phase 129 (4GB bootstrap harden): cap the Go runtime heap across all
      # steps so the combined-suite flake class (OOM stalls/SEGFAULTs of the
      # kcc-build mode on small hosts) is bounded on CI too. 8GiB is well above
      # normal flows; it only prevents unbounded growth.
      GOMEMLIMIT: 8GiB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install GCC and GMP
        run: sudo apt-get update && sudo apt-get install -y gcc libgmp-dev

      - name: Install wasmtime (WASM gate runner)
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> $GITHUB_PATH

      - name: Run unit tests
        # -p 1 runs each package's test binary sequentially. Parallel package
        # execution intermittently stalled the Phase 107 concurrency gates
        # (TestPhase107_CodegenSpawnJoin) under combined-suite load; sequential
        # package runs keep the unit gate deterministic on 2-core runners.
        # pkg/lsp carries the Phase 136 semantic-IDE suite (30 tests) and
        # pkg/compiler the Phase 105/134 incremental-cache suites — both ship
        # with their phases, so they gate here like the other unit packages.
        run: go test -p 1 ./pkg/lexer/... ./pkg/parser/... ./pkg/codegen/... ./pkg/pm/... ./pkg/lsp/... ./pkg/compiler/... -count=1 -v

      - name: Vet
        run: go vet ./...

      - name: Cross-arch vet (32-bit hosts)
        # The release build matrix ships GOARCH=386 and arm, but every build
        # step below compiles only ./cmd/karkain, so a leaf package can carry a
        # defect that breaks those archives and still go green here. This is
        # exactly how pkg/native shipped `MachoBase + fileOffset` arithmetic on
        # an untyped 0x100000000 constant, which overflows a 32-bit int.
        # `go vet` type-checks the whole tree, so it catches constant overflow
        # and width mismatches without needing a 32-bit toolchain to run tests.
        run: |
          GOOS=linux GOARCH=386 go vet ./...
          GOOS=linux GOARCH=arm go vet ./...

      - name: Build compiler
        run: go build -o karkain ./cmd/karkain

      - name: Run E2E gates (Phase 114 example corpus, Go engine)
        run: go test ./pkg/cli/ -run 'TestPhase114_CorpusExamples_GoEngine|TestPhase114_CorpusCoverage' -count=1

      - name: Run Phase 115 developer-preview gate (fresh-checkout simulation)
        run: go test ./pkg/cli/ -run 'TestPhase115' -count=1

      - name: Run Phase 116 corpus metadata gate
        run: go test ./pkg/cli/ -run 'TestPhase116' -count=1

      - name: Run Phase 117 Beta gate
        run: go test ./pkg/cli/ -run 'TestPhase117' -count=1

      - name: Run Phase 118 release-candidate gate
        run: go test ./pkg/cli/ -run 'TestPhase118' -count=1

      - name: Run Phase 119 stable-release-preparedness gate
        run: go test ./pkg/cli/ -run 'TestPhase119' -count=1

      - name: Run Phase 122 compiler-pipeline-ownership gate
        run: go test ./pkg/cli/ -run 'TestPhase122' -count=1

      - name: Run Phase 123 enum-ADT + WASM boundary gates
        run: go test ./pkg/cli/ -run 'TestPhase123' -count=1

      - name: Run Phase 124 compute-target gate
        run: go test ./pkg/cli/ -run 'TestPhase124' -count=1

      - name: Run Phase 132 stdlib-freeze gate
        run: go test ./pkg/cli/ -run 'TestPhase132' -count=1

      - name: Run Phase 133 first-class-fn gate
        run: go test ./pkg/cli/ -run 'TestPhase133|TestPhase130' -count=1

      - name: Run Phase 134 incremental-compilation-v2 gate
        run: go test ./pkg/cli/ -run 'TestPhase134' -count=1

      - name: Run Phase 135 local-registry gate
        run: go test ./pkg/cli/ -run 'TestPhase135' -count=1

      - name: Run concurrency-runtime freshness gate
        # The self-hosted concurrency emitter (src/compiler/conc_runtime.kark)
        # is generated from runtime/concurrency/c/* — this pins the mapping
        # so a hand-edit or source drift fails fast with the regen command.
        run: go test ./pkg/codegen/ -run 'TestConcRuntimeKarkFresh' -count=1

      - name: Run Phase 137 concurrency-parity gate
        run: go test ./pkg/cli/ -run 'TestPhase137' -count=1

      - name: Run Phase 138 accelerator-kernel-surface gate
        run: go test ./pkg/cli/ -run 'TestPhase138' -count=1

      - name: Run Phase 139 cross-compilation-expansion gate
        run: go test ./pkg/cli/ -run 'TestPhase139' -count=1

      - name: Run Phase 140 debugger-integration gate
        run: go test ./pkg/cli/ -run 'TestPhase140|TestVSCodeExtension' -count=1

      - name: Run Phase 141 optimizer-pipeline gate
        run: go test ./pkg/codegen/ -run 'TestPhase141' -count=1

      - name: Run Phase 142 release gate
        run: go test ./pkg/cli/ -run 'TestPhase142' -count=1

      - name: Run Phase 143 seed-closure gate
        # Self-skips fast when go/gcc/RAM requirements are absent; runs the
        # full go-less closure (stages 2+3 + identity) on capable runners.
        run: go test ./pkg/bootstrap/ -run 'TestBootstrap_SeedClosure|TestBootstrap_SeedSmoke|TestBootstrap_GoStubShadow' -count=1 -v

      - name: Run Phase 144 PM-resolution gate
        run: go test ./pkg/cli/ -run 'TestPhase144' -count=1

      - name: Run Phase 145 native-backend gate
        run: go test ./pkg/native/ -count=1

      - name: Run Phase 146 generics gate
        run: go test ./pkg/cli/ -run 'TestPhase146_|TestPhase146B|TestPhase146C|TestPhase146D' -count=1

      # Execution bisection: one step per micro-program so each case's
      # pass/fail is visible as a step conclusion (log-independent).
      # if:always — these are diagnostic: they must run even when the
      # native gate above fails (otherwise a red gate hides the very
      # data needed to fix it, and all later steps skip).
      - name: Bisect empty
        if: always()
        run: go test ./pkg/native/ -run 'TestNativeBisect/empty' -count=1 -v
      - name: Bisect retcode
        if: always()
        run: go test ./pkg/native/ -run 'TestNativeBisect/retcode' -count=1 -v
      - name: Bisect int42
        if: always()
        run: go test ./pkg/native/ -run 'TestNativeBisect/int42' -count=1 -v
      - name: Bisect str
        if: always()
        run: go test ./pkg/native/ -run 'TestNativeBisect/str' -count=1 -v
      - name: Bisect arith
        if: always()
        run: go test ./pkg/native/ -run 'TestNativeBisect/arith' -count=1 -v
      - name: Bisect call
        if: always()
        run: go test ./pkg/native/ -run 'TestNativeBisect/call' -count=1 -v

      - name: Run Phase 148 native-target gate
        # CLI surface for native-x86_64-linux (Go engine): target
        # registration, build-writes-image, run refusal, incremental
        # refusal, listing. Execution goldens run in the pkg/native
        # gate above (Linux) with structural validation elsewhere.
        run: go test ./pkg/cli/ -run 'TestPhase148' -count=1

      # Increment 151: the kcc native-parity track. These four gates were
      # written but NOT wired here between 146D and this step, so every green
      # run in that window was reporting success without exercising them --
      # a gate that never runs is not a gate. They are wired as one step
      # because each is fast (the encoder and both container writers are
      # compared byte-for-byte against the Go oracle, which needs no
      # execution host).
      - name: Run Phase 151 kcc native-parity gates
        run: go test ./pkg/cli/ -run 'TestPhase151|TestPhase151P0|TestPhase151B|TestPhase151C|TestPhase151C2' -count=1 -timeout 30m

      # Phase 151C3, the PE32+ container. It lives in pkg/native rather than
      # pkg/cli because the differential needs the Go Builder's unexported
      # patch fields, which a pkg/cli gate cannot construct. The existing
      # `go test ./pkg/native/ -count=1` step above would pick it up, but
      # relying on that is implicit: this repository has previously shipped
      # gates that were written, run locally, reported green, and never
      # executed by CI at all. The step is therefore named explicitly.
      - name: Run Phase 151C3 PE container gate
        run: go test ./pkg/native/ -run 'TestPhase151C3' -count=1 -timeout 20m -v

      # LH-1, kcc `?` propagation parity: an authorised slice of the
      # Language Hardening Checkpoint (not a numbered phase). Named
      # explicitly for the same reason as the gate above -- a gate that is
      # only picked up incidentally by a broader step is a gate that can
      # silently stop running.
      - name: Run LH-1 kcc propagation parity gate
        run: go test ./pkg/cli/ -run 'TestLH1_' -count=1 -timeout 30m

      # LH-2, kcc `match` arm binding parity: the second authorized slice of
      # the Language Hardening Checkpoint. Named explicitly for the same
      # reason as the gates above.
      - name: Run LH-2 kcc match-binding parity gate
        run: go test ./pkg/cli/ -run 'TestLH2_' -count=1 -timeout 30m

      # 151A Step 1, the native value/frame foundation in kcc. The three-way
      # differential (kcc vs the Go oracle's Emitter vs bytes stated from the
      # Intel SDM) is what makes the frame layout trustworthy, so this gate is
      # named explicitly rather than left to an incidental broader step.
      - name: Run 151A native value/frame foundation gate
        run: go test ./pkg/cli/ -run 'TestPhase151A_' -count=1 -timeout 30m

      - name: Run Phase 141 SSA unit gate
        run: go test ./pkg/ir/ssa/ -count=1

      - name: Run Phase 139 triple-model unit gate
        run: go test ./pkg/target/ ./pkg/wit/ -count=1

      - name: Run conformance tests
        run: |
          echo "Karkain-native conformance corpus:"
          ./karkain test conformance/
          echo "Format-checking conformance corpus:"
          for f in conformance/*_test.kark; do
            ./karkain fmt --check "$f" || { echo "needs format: $f"; exit 1; }
          done

  native-evidence:
    # Phase 147A: decisive-evidence gatherer for the native-execution P1
    # (docs/audit/PHASE-145-QUARANTINE.md). Informational ONLY
    # (continue-on-error): it dumps one linked image and captures
    # readelf/strace into the step log. It can never fail the build; the
    # mandatory suite is the `test` job's pkg/native gate above.
    name: Native P1 evidence (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install forensics tools
        run: sudo apt-get update && sudo apt-get install -y binutils strace || true

      - name: Dump linked image (empty bisect program)
        env:
          KARKAIN_NATIVE_DUMP: ${{ runner.temp }}/native-evidence
        run: go test ./pkg/native/ -run 'TestNativeEvidenceDump' -count=1 -v

      - name: Execute native suite under quarantine flag (147C prover)
        # Runs the genuine execution tests with the P1 flag set. The `|| true`
        # keeps this informational step green either way — the PASS/FAIL lines
        # in the output are the signal, and the mandatory suite never depends
        # on them. When this step goes green, the quarantine is lifted.
        if: always()
        env:
          KARKAIN_NATIVE_EXEC: 1
        run: go test ./pkg/native/ -run 'TestNativeBisect|TestNativeHello|TestNativeCalls' -count=1 -v || true

      - name: readelf headers and program headers
        if: always()
        run: readelf -h -l ${{ runner.temp }}/native-evidence/native-empty || true

      - name: strace execution
        if: always()
        run: strace -f -e trace=process,write,exit_group,memory ${{ runner.temp }}/native-evidence/native-empty; echo "exit=$?"

  native-windows:
    # Phase 149: PE execution proof. Runs the full pkg/native suite on
    # windows/amd64, the only CI leg that can execute PE images: ELF
    # images skip by platform, PE goldens execute, Mach-O validates
    # structurally. Without this job the CallReg-class regressions
    # (ModRM-level encoder faults) are invisible to CI.
    name: Native PE execution (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # TEMPORARY DIAGNOSTIC - installs nothing, changes nothing, and is
      # expected to be deleted once the runner's toolchain is known.
      #
      # It runs BEFORE the GMP step on purpose: the previous GMP attempt
      # failed at `shell: msys2 {0}` with "msys2: command not found", which
      # only proves the custom shell is unregistered -- it says nothing about
      # which compiler the runner actually provides. The original failure
      # (`gmp.h: No such file or directory`) came from a gcc invocation, so a
      # gcc IS present and lacks GMP headers; that is what this establishes.
      #
      # Every command is guarded and the step is continue-on-error, so a
      # missing toolchain is REPORTED rather than turned into a new failure.
      - name: "Diagnostic: native Windows compiler toolchain"
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "===== 1. GCC ====="
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if ($gcc) {
            Write-Host ("gcc path: " + $gcc.Source)
            try { (gcc --version 2>&1 | Out-String).Trim() | Write-Host } catch { Write-Host ("gcc --version failed: " + $_.Exception.Message) }
          } else {
            Write-Host "gcc: NOT FOUND on PATH"
          }

          Write-Host "===== 2. CLANG ====="
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if ($clang) {
            Write-Host ("clang path: " + $clang.Source)
            try { (clang --version 2>&1 | Out-String).Trim() | Write-Host } catch { Write-Host ("clang --version failed: " + $_.Exception.Message) }
          } else {
            Write-Host "clang: NOT FOUND on PATH"
          }

          Write-Host "===== 3. MSVC (cl) ====="
          $cl = Get-Command cl -ErrorAction SilentlyContinue
          if ($cl) {
            Write-Host ("cl path: " + $cl.Source)
            try { (cl 2>&1 | Out-String).Trim() | Write-Host } catch { Write-Host ("cl failed: " + $_.Exception.Message) }
          } else {
            Write-Host "cl: NOT FOUND on PATH (expected outside a VS developer prompt)"
          }

          Write-Host "===== 4. MSYS2 PATHS (existence only; pacman is NOT run) ====="
          foreach ($p in @("C:\msys64", "C:\msys64\usr\bin\bash.exe", "C:\msys64\ucrt64\bin\gcc.exe", "C:\msys64\ucrt64\bin\pacman.exe")) {
            Write-Host ($p + " : " + (Test-Path -LiteralPath $p))
          }

          Write-Host "===== 5. ENVIRONMENT ====="
          foreach ($v in @("CC", "CXX")) {
            $val = [Environment]::GetEnvironmentVariable($v)
            if ([string]::IsNullOrEmpty($val)) { Write-Host ($v + " : <unset>") } else { Write-Host ($v + " : " + $val) }
          }
          Write-Host ("PATH : " + $env:PATH)

          Write-Host "===== 6. DOES THE GCC ABOVE SEE gmp.h? (read-only probe) ====="
          $tmpdir = Join-Path $env:RUNNER_TEMP "gmpprobe"
          New-Item -ItemType Directory -Path $tmpdir -Force | Out-Null
          $probe = Join-Path $tmpdir "probe.c"
          Set-Content -LiteralPath $probe -Value "#include <gmp.h>`nint main(void){return 0;}" -Encoding ascii
          if ($gcc) {
            $pre = (gcc -E $probe 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0) { Write-Host "gmp.h: FOUND by this gcc" } else { Write-Host ("gmp.h: NOT FOUND by this gcc -- " + $pre.Trim()) }
          } else {
            Write-Host "gmp.h: unknown, no gcc to probe with"
          }

      # TEMPORARY DIAGNOSTIC (read-only) - is there ALREADY a usable GMP under
      # C:\vcpkg that matches this runner's C:\mingw64\bin\gcc.exe?
      #
      # Proven so far: the runner's gcc is standalone MinGW-w64 (MinGW-Builds
      # 15.2.0), C:\msys64\ucrt64 does not exist, and that gcc cannot find
      # gmp.h. C:\vcpkg is on PATH. This establishes whether vcpkg already
      # carries a compatible GMP, WITHOUT installing anything.
      #
      # Include and library directories are DERIVED from where files are
      # actually found, never guessed. Every command is guarded and the step is
      # continue-on-error, so absence is REPORTED rather than turned into a
      # failure.
      - name: "Diagnostic: vcpkg GMP availability (read-only)"
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "===== 1. VCPKG PRESENT? ====="
          Write-Host ("C:\vcpkg            : " + (Test-Path -LiteralPath "C:\vcpkg"))
          $vexe = "C:\vcpkg\vcpkg.exe"
          $hasVexe = Test-Path -LiteralPath $vexe
          Write-Host ("C:\vcpkg\vcpkg.exe  : " + $hasVexe)
          if ($hasVexe) {
            try { (& $vexe version 2>&1 | Out-String).Trim() | Write-Host } catch { Write-Host ("vcpkg version failed: " + $_.Exception.Message) }
          }

          Write-Host "===== 2. gmp.h UNDER C:\vcpkg ====="
          $hdrs = @(Get-ChildItem "C:\vcpkg" -Filter "gmp.h" -Recurse -ErrorAction SilentlyContinue)
          if ($hdrs.Count -eq 0) { Write-Host "gmp.h: NONE FOUND under C:\vcpkg" }
          else { $hdrs | Select-Object -First 20 | ForEach-Object { Write-Host ("  " + $_.FullName) } ; Write-Host ("  total matches: " + $hdrs.Count) }

          Write-Host "===== 3. GMP LIBRARIES UNDER C:\vcpkg ====="
          foreach ($n in @("libgmp.a", "libgmp.dll.a", "gmp.lib", "gmp.dll", "libgmp-10.dll")) {
            $hits = @(Get-ChildItem "C:\vcpkg" -Filter $n -Recurse -ErrorAction SilentlyContinue)
            if ($hits.Count -eq 0) { Write-Host ($n + " : none") }
            else { Write-Host ($n + " : " + $hits.Count + " match(es)"); $hits | Select-Object -First 8 | ForEach-Object { Write-Host ("    " + $_.FullName) } }
          }

          Write-Host "===== 4. INSTALLED PACKAGES ====="
          if ($hasVexe) {
            try { ((& $vexe list 2>&1 | Out-String).Trim() -split "`n" | Select-Object -First 40) -join "`n" | Write-Host } catch { Write-Host ("vcpkg list failed: " + $_.Exception.Message) }
          }

          Write-Host "===== 5. GMP PORT PRESENT? ====="
          foreach ($p in @("C:\vcpkg\ports\gmp", "C:\vcpkg\ports\gmp\portfile.cmake", "C:\vcpkg\ports\gmp\CONTROL")) {
            Write-Host ($p + " : " + (Test-Path -LiteralPath $p))
          }

          Write-Host "===== 6. MINGW TRIPLETS DEFINED IN THIS INSTALLATION ====="
          $trip = @()
          foreach ($d in @("C:\vcpkg\triplets", "C:\vcpkg\triplets\community")) {
            if (Test-Path -LiteralPath $d) { $trip += @(Get-ChildItem $d -Filter "*.cmake" -ErrorAction SilentlyContinue) }
          }
          if ($trip.Count -eq 0) { Write-Host "no triplet definitions found" }
          else { $trip | Where-Object { $_.Name -match "mingw" } | ForEach-Object { Write-Host ("  " + $_.Name) } ; Write-Host ("  total triplets: " + $trip.Count) }

          Write-Host "===== 7. READ-ONLY COMPILE/LINK PROBE WITH THE RUNNER'S gcc ====="
          $gccPath = "C:\mingw64\bin\gcc.exe"
          if (-not (Test-Path -LiteralPath $gccPath)) {
            Write-Host "runner gcc not present at $gccPath -- cannot probe"
          } elseif ($hdrs.Count -eq 0) {
            Write-Host "no gmp.h under C:\vcpkg, so there is nothing to probe against. NOT manufacturing paths."
          } else {
            $inc = $hdrs[0].DirectoryName
            $libdir = $null
            foreach ($n in @("libgmp.dll.a", "libgmp.a", "gmp.lib")) {
              $h = @(Get-ChildItem "C:\vcpkg" -Filter $n -Recurse -ErrorAction SilentlyContinue)
              if ($h.Count -gt 0) { $libdir = $h[0].DirectoryName; Write-Host ("using library: " + $h[0].FullName); break }
            }
            $tmpd = Join-Path $env:RUNNER_TEMP "gmpprobe2"
            New-Item -ItemType Directory -Path $tmpd -Force | Out-Null
            $src = Join-Path $tmpd "probe.c"
            Set-Content -LiteralPath $src -Value "#include <gmp.h>`nint main(void){ mpz_t z; mpz_init_set_ui(z, 7); return (int)mpz_get_ui(z); }" -Encoding ascii
            Write-Host ("include dir (derived): " + $inc)
            Write-Host ("library dir (derived): " + $(if ($libdir) { $libdir } else { "<none found>" }))
            $preOut = (& $gccPath -I $inc -c $src -o (Join-Path $tmpd "probe.o") 2>&1 | Out-String).Trim()
            Write-Host ("COMPILE: " + $(if ($LASTEXITCODE -eq 0) { "OK" } else { "FAILED -- " + $preOut }))
            if ($LASTEXITCODE -eq 0 -and $libdir) {
              $lnOut = (& $gccPath (Join-Path $tmpd "probe.o") -o (Join-Path $tmpd "probe.exe") -L $libdir -lgmp 2>&1 | Out-String).Trim()
              Write-Host ("LINK: " + $(if ($LASTEXITCODE -eq 0) { "OK" } else { "FAILED -- " + $lnOut }))
            } else {
              Write-Host "LINK: not attempted (no library dir, or compile failed)"
            }
          }

      # GMP for the self-hosted compiler's stage-1 build.
      #
      # The 151C3 PE tests compile src/compiler/*.kark into main.c and then
      # link it, and the generated C preamble includes <gmp.h> unconditionally.
      # Without this the job died at
      #   src/compiler/main.c:14:10: fatal error: gmp.h: No such file or directory
      # which is why this job was red on consecutive runs while every gate in
      # the ubuntu `Test` job passed.
      #
      # There is no Windows equivalent of the Test job's `apt-get install
      # libgmp-dev`, so this installs the GMP package for the toolchain the
      # runner actually uses. The failure log shows the compiler resolving
      # C:/msys64/ucrt64/..., i.e. the runner's own MSYS2 ucrt64 gcc, so the
      # package must be the matching ucrt64 one: that places gmp.h in
      # C:/msys64/ucrt64/include, which is on that gcc's default include path.
      # Installing a MinGW-w64 gmp elsewhere would not be found.
      - name: Install GMP (MSYS2 ucrt64)
        shell: msys2 {0}
        run: pacman -S --noconfirm --needed mingw-w64-ucrt-x86_64-gmp

      - name: Put the ucrt64 toolchain on PATH
        run: echo "C:\msys64\ucrt64\bin" >> $env:GITHUB_PATH

      - name: Run native suite (PE executes, ELF skips)
        run: go test ./pkg/native/ -count=1

  toolchain-matrix:
    # Phase 139: cross-linker presence matrix. Informational ONLY (never red):
    # it reports which foreign toolchains the runner happens to carry so
    # "N/A" rows in the docs matrix stay honest. The deterministic-error
    # gate above is the enforcing test; this job only observes.
    name: Cross-linker presence matrix
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Report toolchain presence
        run: |
          for t in gcc clang x86_64-linux-gnu-gcc aarch64-linux-gnu-gcc riscv64-linux-gnu-gcc x86_64-w64-mingw32-gcc aarch64-w64-mingw32-gcc; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "present: $t ($("$t" --version | head -n1))"
            else
              echo "absent:  $t"
            fi
          done
          true

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            format: zip
          - goos: windows
            goarch: arm64
            ext: .exe
            format: zip
          - goos: linux
            goarch: amd64
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: arm
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: "386"
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: ppc64le
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: s390x
            ext: ""
            format: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            format: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            format: tar.gz
          - goos: freebsd
            goarch: amd64
            ext: ""
            format: tar.gz
          - goos: netbsd
            goarch: amd64
            ext: ""
            format: tar.gz
          - goos: openbsd
            goarch: amd64
            ext: ""
            format: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          # Matrix uses real GOARCH values (arm, 386) so the archive name and
          # the Go build agree with the certified 13-archive release set.
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarch == 'arm' && '7' || '' }}
          CGO_ENABLED: '0'
        run: |
          BINARY="karkain${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$BINARY" ./cmd/karkain

      - name: Package (tar.gz)
        if: matrix.format == 'tar.gz'
        run: |
          ARCHIVE="karkain-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$ARCHIVE"
          mv "karkain" "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/" 2>/dev/null || true
          cp -r stdlib "$ARCHIVE/stdlib" 2>/dev/null || true
          echo "${{ github.ref_name }}" > "$ARCHIVE/VERSION"
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE/"

      - name: Package (zip)
        if: matrix.format == 'zip'
        run: |
          ARCHIVE="karkain-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$ARCHIVE"
          mv "karkain${{ matrix.ext }}" "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/" 2>/dev/null || true
          cp -r stdlib "$ARCHIVE/stdlib" 2>/dev/null || true
          echo "${{ github.ref_name }}" > "$ARCHIVE/VERSION"
          zip -r "${ARCHIVE}.zip" "$ARCHIVE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karkain-${{ matrix.goos }}-${{ matrix.goarch }}
          path: karkain-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.format }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f"
          done | tee checksums.txt
          # checksums.txt stays inside artifacts/ so it is uploaded and
          # published alongside the archives (installation.rst tells users
          # to verify against exactly this file).

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## Karkain ${{ github.ref_name }}

            ### Installation
            Download the archive for your platform and add `karkain` to your PATH.

            ### Supported Platforms
            - Windows (amd64, arm64)
            - Linux (amd64, arm64, arm, 386, ppc64le, s390x)
            - macOS (amd64 Intel, arm64 Apple Silicon)
            - FreeBSD (amd64)
            - NetBSD (amd64)
            - OpenBSD (amd64)

            ### Checksums (SHA-256)
            Verify every archive against the attached `checksums.txt` before
            running it (see the installation guide for the exact commands).
          generate_release_notes: true
