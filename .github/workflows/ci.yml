name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/build/html -W --keep-going

      - name: Verify required documentation tree exists
        run: |
          for f in \
            docs/build/html/index.html \
            docs/build/html/getting-started/index.html \
            docs/build/html/language/index.html \
            docs/build/html/stdlib/index.html \
            docs/build/html/tools/index.html \
            docs/build/html/targets/index.html \
            docs/build/html/compiler/index.html \
            docs/build/html/status/index.html \
            docs/build/html/reference/index.html \
            docs/build/html/reference/example-matrix.html \
            docs/build/html/development/index.html \
            docs/build/html/examples/index.html \
            docs/build/html/release-notes/index.html \
          ; do
            if [ ! -f "$f" ]; then
              echo "Missing required doc page: $f"
              exit 1
            fi
          done
          echo "Documentation tree OK"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run unit tests
        run: go test ./pkg/lexer/... ./pkg/parser/... ./pkg/codegen/... ./pkg/pm/... -count=1 -v

      - name: Vet
        run: go vet ./...

      - name: Build compiler
        run: go build -o karkain ./cmd/karkain

      - name: Run E2E gates (Phase 114 example corpus, Go engine)
        run: go test ./pkg/cli/ -run 'TestPhase114_CorpusExamples_GoEngine|TestPhase114_CorpusCoverage' -count=1

      - name: Run Developer Preview gate (fresh-checkout simulation)
        run: go test ./pkg/cli/ -run 'TestPhase115' -count=1

      - name: Run Phase 116 corpus metadata gate
        run: go test ./pkg/cli/ -run 'TestPhase116' -count=1

      - name: Run conformance tests
        run: |
          echo "Karkain-native conformance corpus:"
          ./karkain test conformance/
          echo "Format-checking conformance corpus:"
          for f in conformance/*_test.kark; do
            ./karkain fmt --check "$f" || { echo "needs format: $f"; exit 1; }
          done

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
            format: zip
          - goos: windows
            goarch: arm64
            ext: .exe
            format: zip
          - goos: linux
            goarch: amd64
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: arm64
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: armv7
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: i386
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: ppc64le
            ext: ""
            format: tar.gz
          - goos: linux
            goarch: s390x
            ext: ""
            format: tar.gz
          - goos: darwin
            goarch: amd64
            ext: ""
            format: tar.gz
          - goos: darwin
            goarch: arm64
            ext: ""
            format: tar.gz
          - goos: freebsd
            goarch: amd64
            ext: ""
            format: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          BINARY="karkain${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "$BINARY" ./cmd/karkain

      - name: Package (tar.gz)
        if: matrix.format == 'tar.gz'
        run: |
          ARCHIVE="karkain-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$ARCHIVE"
          mv "karkain" "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/" 2>/dev/null || true
          cp -r stdlib "$ARCHIVE/stdlib" 2>/dev/null || true
          echo "${{ github.ref_name }}" > "$ARCHIVE/VERSION"
          tar czf "${ARCHIVE}.tar.gz" "$ARCHIVE/"

      - name: Package (zip)
        if: matrix.format == 'zip'
        run: |
          ARCHIVE="karkain-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$ARCHIVE"
          mv "karkain${{ matrix.ext }}" "$ARCHIVE/"
          cp README.md LICENSE "$ARCHIVE/" 2>/dev/null || true
          cp -r stdlib "$ARCHIVE/stdlib" 2>/dev/null || true
          echo "${{ github.ref_name }}" > "$ARCHIVE/VERSION"
          zip -r "${ARCHIVE}.zip" "$ARCHIVE/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: karkain-${{ matrix.goos }}-${{ matrix.goarch }}
          path: karkain-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.format }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f"
          done | tee ../checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## Karkain ${{ github.ref_name }}

            ### Installation
            Download the archive for your platform and add `karkain` to your PATH.

            ### Supported Platforms
            - Windows (amd64, arm64)
            - Linux (amd64, arm64, armv7, i386, ppc64le, s390x)
            - macOS (amd64 Intel, arm64 Apple Silicon)
            - FreeBSD (amd64)

            ### Checksums (SHA-256)
            ```
            $(cat checksums.txt)
            ```
          generate_release_notes: true
