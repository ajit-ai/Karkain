# Build and deploy the Karkain documentation to GitHub Pages.
#
# Triggers:
#   - push to main (automatic deploy)
#   - workflow_dispatch (manual)
#
# The generated HTML is never committed to the repository; it is published
# directly from the Actions artifact store to the gh-pages branch.

name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one deploy at a time.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build documentation
        run: python -m sphinx -b html docs/source docs/build/html -W --keep-going

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4