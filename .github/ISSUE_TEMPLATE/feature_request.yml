name: Feature Request
description: Propose a new capability or a meaningful improvement to an existing one.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real problem are you trying to solve? Do not quote a roadmap wishlist item without concrete motivation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the surface you propose. Do not invent final APIs; sketches are welcome.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Target surface
      options:
        - Language (syntax / types / stdlib)
        - Compiler / engines (Go front end, KCC)
        - CLI / tooling
        - Documentation
        - Examples
        - Package manager / workspace
        - Other
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you consider before this proposal?
    validations:
      required: false